[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamblue-a4-speech"
version = "0.1.0"
description = "RQ-A-4-10/20 speech processing and transcript integration"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "numpy>=2.2,<3", "soundfile>=0.13,<0.14", "scipy>=1.15,<2", "sherpa-onnx>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<0.13"]

[project.scripts]
a4-speech = "a4_speech.cli_2024141460331:main_2024141460331"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_model: optional actual model inference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
