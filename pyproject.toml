[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamblue-a4-speech"
version = "0.2.0"
description = "RQ-A-4-10/20 speech processing and transcript integration"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "numpy>=2.2,<3", "soundfile>=0.13,<0.14", "scipy>=1.15,<2", "sherpa-onnx>=1.12,<2", "webrtcvad-wheels==2.0.14.post1", "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic>=2.9,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<0.13", "httpx2==2.16.0"]

[project.scripts]
a4-speech = "a4_speech.cli_2024141460331:main_2024141460331"
a4-speech-api = "a4_speech.api_2024141460331:main_2024141460331"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real_model: optional actual model inference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
